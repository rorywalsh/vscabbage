name: Build and Package Extensions

#Current Csound7 release...
env:
  CSOUND_TAG: "7.0.0"
  # The Linux packaging job still builds cabbage3 locally. macOS, Windows and
  # Windows ARM consume the prebuilt CabbageBundle artifacts from the cabbage
  # repository, so they do not compile C++ in this workflow.
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

on:
  push:
    branches:
      - 'main' # Trigger on pushes to main
  pull_request:
    branches:
      - develop # Trigger on pull requests to develop
      - main # Required checks gate merges into the release line

# Cancel superseded pull-request runs, but never a run on main: that one
# publishes a release, so let it finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate_tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate tagging

      - name: Generate Unique Version Tag
        id: generate_version
        run: |
          # Fetch tags
          git fetch --tags

          # Get the latest 3.0.x-beta tag, ignoring the old 1.0.x-alpha series.
          # First beta starts at 3.0.0-beta to align with the Cabbage 3 rewrite.
          last_tag=$(git tag --list "3.0.*-beta" --sort=-v:refname | head -n 1)
          echo "Last beta tag: $last_tag"

          if [ -z "$last_tag" ]; then
            echo "No previous beta tag found. Starting at 3.0.0-beta."
            new_version="3.0.0-beta"
          elif [[ "$last_tag" =~ ^3\.0\.([0-9]+)-beta$ ]]; then
            patch=${BASH_REMATCH[1]}
            new_patch=$((patch + 1))
            new_version="3.0.${new_patch}-beta"
          else
            echo "Invalid tag format ($last_tag). Defaulting to 3.0.0-beta."
            new_version="3.0.0-beta"
          fi
          echo "New version: $new_version"

          # Set the new version as an output
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

  # ========================================================================================
  #  Test jobs (run on every push to main and every PR to develop)
  # ========================================================================================

  test_unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 31 requires Node ^22.22 || ^24.15; keep the tests on a
          # supported runtime even though packaging still uses Node 20.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  test_integration:
    name: Integration tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install xvfb and Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libgtk-3-0 libnss3 libxss1
          # ALSA was renamed for the 64-bit time_t transition on Ubuntu 24.04.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Downloads a VS Code test instance, activates the extension against a
      # real host, and drives the command surface. Run headless via xvfb.
      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

  # The installers are only built after merge (see the build_* job conditions),
  # so a dependency bump can pass every test above and still break `vsce
  # package` or the production webpack bundle. This cheap job runs on every PR
  # (including Dependabot) and exercises exactly those two steps with the
  # versions pinned in package-lock.json.
  package_smoke:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @vscode/vsce declares node >= 22; keep this in step with the
          # packaging jobs' Node version.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production webpack bundle
        run: npm run package

      # `npm exec` runs the devDependency installed above, so this checks the
      # version in package-lock.json rather than whatever `vsce` is latest.
      # --no-dependencies skips the production dependency audit; the real
      # release jobs still package with the bundled binaries.
      - name: Package a smoke-test VSIX
        run: npm exec -- vsce package --target linux-x64 --no-dependencies --out "$RUNNER_TEMP/smoke.vsix"

      - name: Verify the VSIX was produced
        run: test -s "$RUNNER_TEMP/smoke.vsix"

  # ========================================================================================
  #  Resolve a successful Cabbage backend build before starting any packaging runners
  # ========================================================================================
  resolve_backend:
    name: Resolve Cabbage backend build
    runs-on: ubuntu-latest
    outputs:
      should_package: ${{ steps.should.outputs.should_package }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      backend_sha: ${{ steps.resolve.outputs.backend_sha }}
    steps:
      - name: Determine whether packaging was requested
        id: should
        uses: actions/github-script@v7
        with:
          script: |
            let message = '';
            if (context.eventName === 'push') {
              message = context.payload.head_commit?.message ?? '';
            } else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              // PR title/body are useful fallbacks and make [package] easy to
              // apply without rewriting a commit.
              message = `${pr.title}\n${pr.body ?? ''}`;
              try {
                const [owner, repo] = pr.head.repo.full_name.split('/');
                const { data: commit } = await github.rest.repos.getCommit({
                  owner, repo, ref: pr.head.sha,
                });
                message = `${commit.commit.message}\n${message}`;
              } catch (error) {
                core.warning(`Could not read PR head commit message: ${error.message}`);
              }
            }

            const shouldPackage =
              (context.ref === 'refs/heads/main' ||
                message.includes('[package]') ||
                message.includes('run_build')) &&
              !message.includes('[auto-changelog]');
            core.setOutput('should_package', shouldPackage ? 'true' : 'false');
            core.info(
              `Package requested: ${shouldPackage} ` +
              `(event=${context.eventName}, ref=${context.ref})`
            );

      - name: Find a successful cabbage3-build run
        id: resolve
        if: steps.should.outputs.should_package == 'true'
        uses: actions/github-script@v7
        with:
          # Fine-grained PAT with Actions: read on rorywalsh/cabbage.
          github-token: ${{ secrets.CABBAGE_REPO_TOKEN }}
          script: |
            const owner = 'rorywalsh';
            const repo = 'cabbage';
            const branch = 'develop';
            const workflowId = 'cabbage3.yaml';

            const { data: branchData } = await github.rest.repos.getBranch({
              owner, repo, branch,
            });
            const sha = branchData.commit.sha;

            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflowId, branch, per_page: 100,
            });
            const runs = runsData.workflow_runs;
            const exactRuns = runs.filter((run) => run.head_sha === sha);
            const active = exactRuns.find((run) =>
              run.status === 'queued' || run.status === 'in_progress');

            let run;
            if (active) {
              core.setFailed(
                `cabbage3-build for ${branch}@${sha} is ${active.status}. ` +
                'Wait for it to finish successfully, then re-run packaging.'
              );
              return;
            }

            const exactSuccess = exactRuns.find((run) =>
              run.status === 'completed' && run.conclusion === 'success');
            if (exactSuccess) {
              run = exactSuccess;
              core.info(`Using exact cabbage3-build run ${run.id} for ${branch}@${sha}`);
            } else if (exactRuns.length > 0) {
              const failed = exactRuns[0];
              core.setFailed(
                `cabbage3-build for ${branch}@${sha} is ${failed.status}` +
                `${failed.conclusion ? ` (${failed.conclusion})` : ''}. ` +
                'Fix or re-run the backend build, then re-run packaging.'
              );
              return;
            } else {
              // No run for this SHA normally means the push was docs-only and
              // was skipped by paths-ignore. Reuse the newest successful build.
              run = runs.find((candidate) =>
                candidate.status === 'completed' && candidate.conclusion === 'success');
              if (!run) {
                core.setFailed(`No successful cabbage3-build run found on ${branch}.`);
                return;
              }
              core.warning(
                `No cabbage3-build run exists for ${branch}@${sha}. ` +
                `Reusing the latest successful backend ${run.head_sha} from run ${run.id}.`
              );
            }

            const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100,
            });
            const artifactNames = new Set(artifactsData.artifacts.map((artifact) => artifact.name));
            const required = [
              'CabbageBundle-macos',
              'CabbageBundle-windows',
              'CabbageBundle-windows-arm',
            ];
            const missing = required.filter((name) => !artifactNames.has(name));
            if (missing.length > 0) {
              core.setFailed(
                `Backend run ${run.id} (${run.head_sha}) is missing required artifacts: ` +
                missing.join(', ')
              );
              return;
            }

            core.setOutput('run_id', String(run.id));
            core.setOutput('backend_sha', run.head_sha);

  build_macos:
    needs: [generate_tag, resolve_backend]
    runs-on: macos-latest
    # Packaging is gated by resolve_backend (main pushes, or [package] in the
    # pushed commit message / PR head commit message).
    if: needs.resolve_backend.outputs.should_package == 'true'
    steps:
      # Checkout source code for vscabbage
      - name: Checkout source code for vscabbage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Update version in package.json
        shell: bash
        run: |
          VERSION=${{ needs.generate_tag.outputs.version }}
          echo "Updating package.json with version $VERSION"
          # Use proper quoting to handle version string safely
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.$$.json && mv tmp.$$.json package.json

      # Create CabbageBinaries folder
      - name: Create CabbageBinaries folder
        run: |
          mkdir -p "./src/CabbageBinaries"
          cd src
          ls

      - name: Download Cabbage binaries from cabbage
        uses: actions/download-artifact@v4
        with:
          name: CabbageBundle-macos
          path: ${{ runner.temp }}/cabbage-bundle
          repository: rorywalsh/cabbage
          run-id: ${{ needs.resolve_backend.outputs.run_id }}
          github-token: ${{ secrets.CABBAGE_REPO_TOKEN }}

      - name: Extract Cabbage binaries
        run: |
          ditto -x -k "${{ runner.temp }}/cabbage-bundle/CabbageBundle.zip" "${{ runner.temp }}/cabbage-bundle-extracted"
          find "${{ runner.temp }}/cabbage-bundle-extracted" -type d \( -name '*.vst3' -o -name '*.clap' -o -name '*.component' \) -prune -exec cp -R {} ./src/CabbageBinaries/ \;
          cp "${{ runner.temp }}/cabbage-bundle-extracted/CabbageApp/Release/CabbageApp" ./src/CabbageBinaries/CabbageApp
          chmod -R +x ./src/CabbageBinaries/CabbageApp

      - name: Verify extracted binaries
        run: |
          missing=0
          for binary in CabbagePluginEffect.vst3 CabbagePluginSynth.vst3 CabbagePluginEffect.clap CabbagePluginSynth.clap CabbagePluginEffectARA.vst3 CabbagePluginSynthARA.vst3 CabbagePluginEffectAUv2.component CabbagePluginSynthAUv2.component CabbagePluginMidiFxAUv2.component CabbageApp; do
            if [ ! -e "./src/CabbageBinaries/$binary" ]; then
              echo "::error::Missing extracted backend binary: $binary"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js (v24) on macOS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies on macOS
        run: npm install

      # The bundle round-trip can lose the executable mode, so restore it on
      # the copy that is about to go into the VSIX. Otherwise the extension
      # ships a backend macOS cannot spawn.
      - name: Restore executable bit on CabbageApp (macOS)
        run: |
          chmod -R +x ./src/CabbageBinaries/CabbageApp
          if [ ! -x ./src/CabbageBinaries/CabbageApp ]; then
            echo "::error::CabbageApp is still not executable after chmod"
            ls -l ./src/CabbageBinaries
            exit 1
          fi
          ls -l ./src/CabbageBinaries/CabbageApp

      - name: Build and package extension on macOS
        # Declare the platform target so VS Code refuses to install this
        # ARM64 macOS build on an Intel Mac (and vice versa) instead of
        # shipping a backend that can never launch.
        run: npm exec -- vsce package --target darwin-arm64 --out vscabbage-${{ needs.generate_tag.outputs.version }}-macos.vsix

      - name: Upload VSIX artifact from macOS
        uses: actions/upload-artifact@v4
        with:
          name: vscabbage-extension-macos
          path: vscabbage-${{ needs.generate_tag.outputs.version }}-macos.vsix

# ========================================================================================
#  Windows build job
# ========================================================================================

  build_windows:
    needs: [generate_tag, resolve_backend]
    runs-on: windows-latest
    # Packaging is gated by resolve_backend (main pushes, or [package] in the
    # pushed commit message / PR head commit message).
    if: needs.resolve_backend.outputs.should_package == 'true'
    steps:
      - name: Checkout source code for vscabbage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Update version in package.json
        shell: pwsh
        run: |
          $env:VERSION = "${{ needs.generate_tag.outputs.version }}"
          Write-Host "Updating package.json with version $env:VERSION"
          jq --arg version "$env:VERSION" '.version = $version' package.json | Set-Content package.json

      - name: Set up Node.js (v24) on Windows
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies on Windows
        run: npm install

      # Create CabbageBinaries folder
      - name: Create CabbageBinaries folder
        run: |
          mkdir -p "./src/CabbageBinaries"
          cd src
          ls

      - name: Download Cabbage binaries from cabbage
        uses: actions/download-artifact@v4
        with:
          name: CabbageBundle-windows
          path: ${{ runner.temp }}/cabbage-bundle
          repository: rorywalsh/cabbage
          run-id: ${{ needs.resolve_backend.outputs.run_id }}
          github-token: ${{ secrets.CABBAGE_REPO_TOKEN }}

      - name: Extract Cabbage binaries
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}/cabbage-bundle/CabbageBundle.zip" -DestinationPath "${{ runner.temp }}/cabbage-bundle-extracted" -Force
          $items = Get-ChildItem "${{ runner.temp }}/cabbage-bundle-extracted" -Recurse | Where-Object { $_.Name -match '\.(vst3|clap|component)$' }
          foreach ($item in $items) {
            Copy-Item -Path $item.FullName -Destination ./src/CabbageBinaries -Recurse -Force
          }
          Copy-Item -Path "${{ runner.temp }}/cabbage-bundle-extracted/CabbageApp/Release/CabbageApp.exe" -Destination ./src/CabbageBinaries/CabbageApp.exe -Force

      - name: Verify extracted binaries
        shell: pwsh
        run: |
          $required = @(
            'CabbagePluginEffect.vst3',
            'CabbagePluginSynth.vst3',
            'CabbagePluginEffect.clap',
            'CabbagePluginSynth.clap',
            'CabbagePluginEffectARA.vst3',
            'CabbagePluginSynthARA.vst3',
            'CabbageApp.exe'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path './src/CabbageBinaries' $name))) {
              Write-Error "Missing extracted backend binary: $name"
              exit 1
            }
          }

      - name: Build and package extension on Windows
        # Declare the platform target so the Marketplace serves the x64
        # binaries only to x64 users (win32-arm64 accepts x64 packages).
        run: npm exec -- vsce package --target win32-x64 --out vscabbage-${{ needs.generate_tag.outputs.version }}-windows-x64.vsix

      - name: Upload VSIX artifact from Windows
        uses: actions/upload-artifact@v4
        with:
          name: vscabbage-extension-windows-x64
          path: vscabbage-${{ needs.generate_tag.outputs.version }}-windows-x64.vsix

# ========================================================================================
#  Windows ARM64 build job
# ========================================================================================

  build_windows_arm:
    needs: [generate_tag, resolve_backend]
    runs-on: windows-11-arm
    # Packaging is gated by resolve_backend (main pushes, or [package] in the
    # pushed commit message / PR head commit message).
    if: needs.resolve_backend.outputs.should_package == 'true'
    steps:
      - name: Checkout source code for vscabbage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Update version in package.json
        shell: pwsh
        run: |
          $env:VERSION = "${{ needs.generate_tag.outputs.version }}"
          Write-Host "Updating package.json with version $env:VERSION"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Set up Node.js (v24) on Windows ARM64
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies on Windows ARM64
        run: npm install

      # Create CabbageBinaries folder
      - name: Create CabbageBinaries folder
        run: |
          mkdir -p "./src/CabbageBinaries"
          cd src
          ls

      - name: Download Cabbage binaries from cabbage
        uses: actions/download-artifact@v4
        with:
          name: CabbageBundle-windows-arm
          path: ${{ runner.temp }}/cabbage-bundle
          repository: rorywalsh/cabbage
          run-id: ${{ needs.resolve_backend.outputs.run_id }}
          github-token: ${{ secrets.CABBAGE_REPO_TOKEN }}

      - name: Extract Cabbage binaries
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}/cabbage-bundle/CabbageBundle.zip" -DestinationPath "${{ runner.temp }}/cabbage-bundle-extracted" -Force
          $items = Get-ChildItem "${{ runner.temp }}/cabbage-bundle-extracted" -Recurse | Where-Object { $_.Name -match '\.(vst3|clap|component)$' }
          foreach ($item in $items) {
            Copy-Item -Path $item.FullName -Destination ./src/CabbageBinaries -Recurse -Force
          }
          Copy-Item -Path "${{ runner.temp }}/cabbage-bundle-extracted/CabbageApp/Release/CabbageApp.exe" -Destination ./src/CabbageBinaries/CabbageApp.exe -Force

      - name: Verify extracted binaries
        shell: pwsh
        run: |
          $required = @(
            'CabbagePluginEffect.vst3',
            'CabbagePluginSynth.vst3',
            'CabbagePluginEffect.clap',
            'CabbagePluginSynth.clap',
            'CabbagePluginEffectARA.vst3',
            'CabbagePluginSynthARA.vst3',
            'CabbageApp.exe'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path './src/CabbageBinaries' $name))) {
              Write-Error "Missing extracted backend binary: $name"
              exit 1
            }
          }

      - name: Build and package extension on Windows ARM64
        # Declare the platform target so the Marketplace serves the ARM64
        # binaries only to ARM64 users.
        run: npm exec -- vsce package --target win32-arm64 --out vscabbage-${{ needs.generate_tag.outputs.version }}-windows-arm.vsix

      - name: Upload VSIX artifact from Windows ARM64
        uses: actions/upload-artifact@v4
        with:
          name: vscabbage-extension-windows-arm
          path: vscabbage-${{ needs.generate_tag.outputs.version }}-windows-arm.vsix

# ========================================================================================
#  Linux build job
# ========================================================================================

  build_linux:
    needs: [generate_tag, resolve_backend]
    # Build against the OLDEST glibc we support, not ubuntu-latest. Since
    # November 2026 ubuntu-latest is Ubuntu 26.04 (glibc 2.43); a binary built
    # there refuses to start on Ubuntu 24.04 (glibc 2.39) or 22.04 (glibc 2.35)
    # with "version `GLIBC_2.43' not found". glibc symbol versioning is only
    # forward-compatible, so the VSIX must be produced on an older distro.
    # ubuntu-22.04 is deprecated on 2027-04-17; before then, move this job into
    # an ubuntu:22.04 container (or equivalent) to keep the 2.35 floor.
    runs-on: ubuntu-22.04
    # Packaging is gated by resolve_backend (main pushes, or [package] in the
    # pushed commit message / PR head commit message).
    if: needs.resolve_backend.outputs.should_package == 'true'
    steps:
      - name: Checkout source code for cabbage3
        uses: actions/checkout@v4
        with:
          repository: rorywalsh/cabbage
          path: cabbage3
          ref: develop
          fetch-depth: 1
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev libxext-dev \
            libasound2-dev libjack-jackd2-dev libpulse-dev

      - name: Install build-essential
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build and install Csound
        run: |
          sudo apt-get install -y \
            libsndfile1-dev libportaudio2 portaudio19-dev libportmidi-dev \
            libpulse-dev swig liblua5.1-0-dev default-jdk \
            libfluidsynth-dev liblo-dev fluid \
            ladspa-sdk libpng-dev dssi-dev libgmm++-dev \
            bison flex libportsmf-dev libeigen3-dev libcunit1-dev \
            gettext libsamplerate0-dev
          git clone --depth 1 --branch ${{ env.CSOUND_TAG }} \
            https://github.com/csound/csound.git csound-src
          cmake -G "Unix Makefiles" -B csound-src/build -S csound-src \
            -DINSTALL_PYTHON_INTERFACE=OFF
          cd csound-src/build
          make
          sudo make install

      - name: Configure and build
        run: |
          cd cabbage3
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ALL_TARGETS=ON \
            -DCMAKE_C_COMPILER=$(which gcc) \
            -DCMAKE_CXX_COMPILER=$(which g++)

      - name: Verify builds
        run: |
          echo "Checking if the build artifacts exist for CabbageApp"
          ls cabbage3/build/CabbageApp
          echo "Checking if the build artifacts exist for CabbagePluginSynth/Effect"
          ls cabbage3/build/CabbagePluginEffect/CabbagePluginEffect_assets
          ls cabbage3/build/CabbagePluginSynth/CabbagePluginSynth_assets

      - uses: actions/upload-artifact@v4
        with:
          name: CabbageApp-linux
          path: cabbage3/build/CabbageApp/CabbageApp
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CabbagePluginEffect-linux.vst3
          path: cabbage3/build/CabbagePluginEffect/CabbagePluginEffect_assets/CabbagePluginEffect.vst3
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CabbagePluginSynth-linux.vst3
          path: cabbage3/build/CabbagePluginSynth/CabbagePluginSynth_assets/CabbagePluginSynth.vst3
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CabbagePluginEffect-linux.clap
          path: cabbage3/build/CabbagePluginEffect/CabbagePluginEffect_assets/CabbagePluginEffect.clap
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: CabbagePluginSynth-linux.clap
          path: cabbage3/build/CabbagePluginSynth/CabbagePluginSynth_assets/CabbagePluginSynth.clap
          retention-days: 1
          if-no-files-found: ignore

      - name: Checkout source code for vscabbage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Update version in package.json
        shell: bash
        run: |
          VERSION=${{ needs.generate_tag.outputs.version }}
          echo "Updating package.json with version $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.$$.json && mv tmp.$$.json package.json

      - name: Create CabbageBinaries folder
        run: |
          mkdir -p "./src/CabbageBinaries"

      - name: Downloading CabbageApp
        uses: actions/download-artifact@v4
        with:
          name: CabbageApp-linux
          path: "./src/CabbageBinaries"
        continue-on-error: false

      - name: Downloading CabbagePluginEffect
        uses: actions/download-artifact@v4
        with:
          name: CabbagePluginEffect-linux.vst3
          path: "./src/CabbageBinaries/CabbagePluginEffect.vst3"
        continue-on-error: false

      - name: Downloading CabbagePluginSynth
        uses: actions/download-artifact@v4
        with:
          name: CabbagePluginSynth-linux.vst3
          path: "./src/CabbageBinaries/CabbagePluginSynth.vst3"
        continue-on-error: false

      - name: Downloading CabbagePluginEffect CLAP
        uses: actions/download-artifact@v4
        with:
          name: CabbagePluginEffect-linux.clap
          path: "./src/CabbageBinaries"
        continue-on-error: false

      - name: Downloading CabbagePluginSynth CLAP
        uses: actions/download-artifact@v4
        with:
          name: CabbagePluginSynth-linux.clap
          path: "./src/CabbageBinaries"
        continue-on-error: false

      - name: Set up Node.js (v24) on Linux
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies on Linux
        run: npm install

      # actions/upload-artifact zips files and drops their modes, so the
      # executable bit on the built CabbageApp does not survive the
      # upload/download round-trip. Restore it on the copy that is about to
      # go into the VSIX, otherwise the extension ships a Linux backend that
      # cannot be spawned.
      - name: Restore executable bit on CabbageApp (Linux)
        run: |
          chmod -R +x ./src/CabbageBinaries/CabbageApp
          if [ ! -x ./src/CabbageBinaries/CabbageApp ]; then
            echo "::error::CabbageApp is still not executable after chmod"
            ls -l ./src/CabbageBinaries
            exit 1
          fi
          ls -l ./src/CabbageBinaries/CabbageApp

      # Packaging on an older runner is only useful if the binaries actually
      # link against that runner's glibc. Fail the build (rather than shipping
      # a VSIX that cannot launch on users' machines) if any bundled binary
      # needs a newer libc than the ubuntu-22.04 floor.
      - name: Verify bundled Linux binaries target glibc 2.35
        run: |
          set -euo pipefail
          max_glibc="2.35"
          mapfile -t bins < <(find ./src/CabbageBinaries -type f \
            \( -name 'CabbageApp' -o -name '*.so' -o -name '*.clap' \) | sort)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::No bundled Linux binaries found to verify"
            exit 1
          fi
          failed=0
          for bin in "${bins[@]}"; do
            required=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sed 's/^GLIBC_//' | sort -Vu | tail -n1)
            if [ -z "$required" ]; then
              echo "$bin: no glibc symbol versions"
              continue
            fi
            echo "$bin: requires glibc $required"
            newest=$(printf '%s\n%s\n' "$max_glibc" "$required" | sort -V | tail -n1)
            if [ "$newest" != "$max_glibc" ]; then
              echo "::error::$bin requires glibc $required, newer than the $max_glibc floor"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build and package extension on Linux
        # Declare the platform target so VS Code refuses to install the x64
        # Linux build on other architectures.
        run: npm exec -- vsce package --target linux-x64 --out vscabbage-${{ needs.generate_tag.outputs.version }}-linux.vsix

      - name: Upload VSIX artifact from Linux
        uses: actions/upload-artifact@v4
        with:
          name: vscabbage-extension-linux
          path: vscabbage-${{ needs.generate_tag.outputs.version }}-linux.vsix

  # =============================================================================
  # steps to tag and release artifacts
  release:
    needs: [build_macos, build_windows, build_windows_arm, build_linux, generate_tag, test_unit, test_integration, resolve_backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'no_build') && !contains(github.event.head_commit.message, '[auto-changelog]')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh CHANGELOG.md for release notes
        # Regenerates the changelog in the workspace (not committed) so the
        # notes below always cover everything up to release time, even if the
        # scheduled changelog workflow hasn't run yet this week.
        run: bash get-commits.sh

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscabbage-extension-macos
          path: ./release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscabbage-extension-windows-x64
          path: ./release

      - name: Download Windows ARM Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscabbage-extension-windows-arm
          path: ./release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscabbage-extension-linux
          path: ./release

      - name: Get Previous Tag
        id: get_previous_tag
        run: |
          git fetch --tags
          # Get the most recent tag before our current version
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v ${{ needs.generate_tag.outputs.version }} | head -n 1)
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, will include all changes"
            echo "PREVIOUS_TAG=initial" >> $GITHUB_ENV
          else
            echo "Previous tag: $PREVIOUS_TAG"
            echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV
          fi

      - name: Generate Release Notes
        id: changelog
        run: |
          # Get the exact datetime of the previous tag
          PREV_DATETIME=$(git log -1 --format=%ai $PREVIOUS_TAG 2>/dev/null || echo "1970-01-01 00:00:00 +0000")
          echo "Filtering changes since: $PREV_DATETIME"
          
          # Extract just the date part (YYYY-MM-DD)
          PREV_DATE=${PREV_DATETIME:0:10}
          
          # First try to get changes from CHANGELOG.md
          CHANGELOG_NOTES=$(awk -F'|' -v prev_date="$PREV_DATE" -v prev_tag="$PREVIOUS_TAG" '
          BEGIN { 
            count = 0
            print "## What'\''s Changed Since " prev_tag "\n"
          }
          NR >= 5 && NF >= 4 {
            repo = $2; gsub(/ /, "", repo)
            entry_date = $3; gsub(/ /, "", entry_date)
            if ((repo == "vscabbage" || repo == "cabbage3" || repo == "cabbage") && entry_date >= prev_date) {
              message = $1; gsub(/^ +| +$/, "", message)
              if (message != "") {
                printf "• %s (%s)\n", message, entry_date
                count++
              }
            }
          }
          END {
            if (count == 0) print "• Maintenance release with under-the-hood improvements"
          }' CHANGELOG.md)
          
          # If no valid changelog entries found, use git log instead
          if [[ "$CHANGELOG_NOTES" == *"Maintenance release"* ]]; then
            echo "No changelog entries found, using git log"
            CHANGELOG_NOTES=$(git log --pretty=format:"• %s (%ad)" --date=short --since="$PREV_DATETIME" | grep -v "triggering build")
            
            if [ -z "$CHANGELOG_NOTES" ]; then
              # Final fallback - get all commits since tag
              CHANGELOG_NOTES=$(git log --pretty=format:"• %s (%ad)" --date=short $PREVIOUS_TAG..HEAD | grep -v "triggering build")
              [ -z "$CHANGELOG_NOTES" ] && CHANGELOG_NOTES="• Maintenance release with under-the-hood improvements"
            fi
          fi
          
          echo "Generated release notes:"
          echo "$CHANGELOG_NOTES"

          # Record which backend commit this release was built against. The
          # packaging jobs use the CabbageBundle resolved by resolve_backend;
          # use that SHA rather than re-resolving develop, which may have moved
          # on (or may not have finished building yet).
          CABBAGE_SHA="${{ needs.resolve_backend.outputs.backend_sha }}"
          if [ -z "$CABBAGE_SHA" ]; then
            CABBAGE_SHA=$(git ls-remote https://github.com/rorywalsh/cabbage.git refs/heads/develop | cut -f1)
          fi
          echo "Backend cabbage SHA used for this release: $CABBAGE_SHA"
          CHANGELOG_NOTES="$CHANGELOG_NOTES

          Built against cabbage @ $CABBAGE_SHA"

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        run: |
          gh release create ${{ needs.generate_tag.outputs.version }} \
            ./release/vscabbage-${{ needs.generate_tag.outputs.version }}-*.vsix \
            --title "${{ needs.generate_tag.outputs.version }}" \
            --notes "$RELEASE_NOTES" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}

      - name: Cleanup Old Tags
        run: |
          git fetch --tags
          # Keep the 2 most recent tags
          for tag in $(git tag --sort=-v:refname | tail -n +3); do
            gh release delete "$tag" --yes || echo "No release found for $tag"
            git tag -d "$tag"
            git push origin ":refs/tags/$tag"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
